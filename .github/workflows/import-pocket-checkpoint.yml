name: Import OpenRCT2 Pocket checkpoint
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-pocket-checkpoint.yml, .checkpoint/pocket.bundle.b64]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'keeganwhitacre/openrct2-pocket'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and restore exact checkpoint history
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .checkpoint/pocket.bundle.b64 > "$RUNNER_TEMP/pocket.bundle"
          echo "45dc40bdf17c67a0e3f3aa5313dd26308ef13a88f1a6dbac745d33680fc52fe5  $RUNNER_TEMP/pocket.bundle" | sha256sum --check
          git remote add upstream https://github.com/OpenRCT2/OpenRCT2.git
          git fetch --no-tags upstream 21afdbc55008335cd70e72a53d465608f9f645ac
          git bundle verify "$RUNNER_TEMP/pocket.bundle"
          git fetch "$RUNNER_TEMP/pocket.bundle" refs/heads/handheld/park-explorer:refs/heads/handheld/park-explorer refs/tags/brick-explorer-proof1:refs/tags/brick-explorer-proof1 refs/tags/pocket-menu-native-0.2:refs/tags/pocket-menu-native-0.2
          test "$(git rev-parse handheld/park-explorer)" = 9e334fb1127768a52d29653b007dffa8ed57fa5f
          test "$(git rev-parse pocket-menu-native-0.2^{commit})" = 9e334fb1127768a52d29653b007dffa8ed57fa5f
          git push --atomic origin refs/heads/handheld/park-explorer refs/tags/brick-explorer-proof1 refs/tags/pocket-menu-native-0.2
      - name: Merge complete source into main and remove import scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git switch main
          git merge --allow-unrelated-histories --no-ff --no-commit handheld/park-explorer
          git rm README.md .github/workflows/import-pocket-checkpoint.yml .checkpoint/pocket.bundle.b64
          test "$(git write-tree)" = "$(git rev-parse handheld/park-explorer^{tree})"
          git commit -m "Checkpoint complete OpenRCT2 Pocket foundation" -m "Import exact source checkpoint 9e334fb1127768a52d29653b007dffa8ed57fa5f, preserving original OpenRCT2 history and the repository's initial commit. Native menu validation passed; new menus remain Brick untested."
          git push origin HEAD:main
          echo "Checkpoint source: $(git rev-parse handheld/park-explorer)" >> "$GITHUB_STEP_SUMMARY"
          echo "Main merge: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: brick-explorer-proof1, pocket-menu-native-0.2" >> "$GITHUB_STEP_SUMMARY"
