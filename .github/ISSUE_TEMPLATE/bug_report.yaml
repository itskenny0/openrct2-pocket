name: Bug report
description: Something broke, crashed or behaved wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If the problem is in RCT2's simulation itself and also happens in
        desktop OpenRCT2, please report it to [OpenRCT2](https://github.com/OpenRCT2/OpenRCT2/issues) instead.
  - type: input
    id: version
    attributes:
      label: Pocket version
      description: The release (e.g. v0.4.0-beta.1) or the testing build's commit.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - TrimUI Brick (NextUI)
        - Other handheld (say which below)
        - Desktop with OPENRCT2_HANDHELD=1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the park menu
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Log or save
      description: |
        The log is in `.userdata/tg5040/openrct2-pocket/`. Attach a save if it helps reproduce the problem.
        Please don't attach any RCT2 game files.
